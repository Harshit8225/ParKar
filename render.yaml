# Render Blueprint: creates the API, the web app and Redis in one go.
# Render dashboard -> New -> Blueprint -> pick this repository.
#
# MongoDB is not hosted on Render: create a free MongoDB Atlas cluster and
# paste its connection string into MONGO_URI when Render asks for it.
#
# Values marked `sync: false` are secrets or URLs you enter in the dashboard;
# they are never stored in this file.

services:
  # ---- Backend API (Node) ----
  - type: web
    name: parkar-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci
    startCommand: node src/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: /api/v1
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: parkar-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CAMERA_API_KEY
        generateValue: true
      # The web app's URL, e.g. https://parkar-web.onrender.com (set after the first deploy).
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: PLATFORM_COMMISSION_PERCENT
        value: "10"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # ---- Frontend (static React build) ----
  - type: web
    name: parkar-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # Client-side routing: every path serves the app shell.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20"
      # The API's URL without /api/v1, e.g. https://parkar-api.onrender.com
      - key: VITE_API_BASE_URL
        sync: false

  # ---- Redis (locks, booking batch window, cache) ----
  - type: keyvalue
    name: parkar-redis
    plan: free
    region: singapore
    maxmemoryPolicy: allkeys-lru
    # Reachable only from Render services in the same region.
    ipAllowList: []
