<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ParKar - your smarter, effortless parking solution. Find, book and park instantly." />
    <!-- Tints the browser's own chrome to match the canvas. Kept in sync by ThemeContext. -->
    <meta name="theme-color" content="#F2F2F7" />
    <title>ParKar - Smart Parking, Instantly</title>

    <!--
      Applies the stored theme before the first paint.

      This has to run here, synchronously in <head>, rather than in React: by
      the time a component could set the class the browser has already painted
      a white page, and a returning dark-mode visitor sees it flash. The
      try/catch is not defensive padding - localStorage *throws* in some
      hardened privacy modes, and an uncaught throw here would stop the
      document parsing.

      Light is the default: prefers-color-scheme is deliberately not consulted.
    -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('parkar-theme') === 'dark') {
            document.documentElement.classList.add('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#000000');
          }
        } catch (e) {
          /* No stored preference available: light, as on a first visit. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
