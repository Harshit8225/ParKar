<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 748" width="1400" height="748" role="img" aria-labelledby="tt ds">
  <title id="tt">ParKar system architecture</title>
  <desc id="ds">Three clients reach an Nginx reverse proxy, pass through a Helmet, CORS, Redis rate limiting, JWT and Zod middleware chain into a Node.js and Express monolith core, which talks to MongoDB, Redis, the Gemini Vision API and Razorpay, all deployed with Docker Compose.</desc>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#93A3B5"/>
    </marker>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E77AA"/>
      <stop offset="1" stop-color="#2B5480"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1400" height="748" fill="#FFFFFF"/>

  <g font-family="Segoe UI, Inter, system-ui, -apple-system, Helvetica Neue, Arial, sans-serif">

    <!-- ============================ CLIENTS ============================ -->
    <g>
      <rect x="30" y="28" width="430" height="66" rx="12" fill="#EFF3F8" stroke="#C7D3E1" stroke-width="1.5"/>
      <rect x="484" y="28" width="430" height="66" rx="12" fill="#EFF3F8" stroke="#C7D3E1" stroke-width="1.5"/>
      <rect x="938" y="28" width="430" height="66" rx="12" fill="#EFF3F8" stroke="#C7D3E1" stroke-width="1.5"/>

      <!-- car -->
      <g transform="translate(52,48) scale(1.08)" fill="none" stroke="#3E6E9E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4.6 13.6 6.3 9A2.2 2.2 0 0 1 8.4 7.6h7.2A2.2 2.2 0 0 1 17.7 9l1.7 4.6"/>
        <rect x="3.2" y="13.4" width="17.6" height="4.8" rx="1.7"/>
        <path d="M7.4 18.2v1.4M16.6 18.2v1.4"/>
      </g>
      <text x="90" y="67" font-size="16" font-weight="600" fill="#1E293B">Driver Web App</text>

      <!-- monitor -->
      <g transform="translate(506,48) scale(1.08)" fill="none" stroke="#3E6E9E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2.6" y="4.4" width="18.8" height="12.4" rx="2"/>
        <path d="M9 20h6M12 16.8V20"/>
      </g>
      <text x="544" y="67" font-size="16" font-weight="600" fill="#1E293B">Owner Console + Gate Terminal</text>

      <!-- gear -->
      <g transform="translate(960,48) scale(1.08)" fill="none" stroke="#3E6E9E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3.3"/>
        <path d="M12 3.1v2.4M12 18.5v2.4M20.9 12h-2.4M5.5 12H3.1M18.3 5.7l-1.7 1.7M7.4 16.6l-1.7 1.7M18.3 18.3l-1.7-1.7M7.4 7.4 5.7 5.7"/>
      </g>
      <text x="998" y="67" font-size="16" font-weight="600" fill="#1E293B">Platform Admin Console</text>
    </g>

    <!-- clients -> nginx -->
    <g stroke="#93A3B5" stroke-width="1.6" fill="none">
      <path d="M245 94v14M699 94v14M1153 94v14"/>
      <path d="M245 108h908"/>
      <path d="M700 108v12" marker-end="url(#arw)"/>
    </g>

    <!-- ============================= NGINX ============================= -->
    <rect x="350" y="122" width="700" height="58" rx="12" fill="#E9F7F0" stroke="#8CC9A8" stroke-width="1.5"/>
    <text x="700" y="157" text-anchor="middle" font-size="19" font-weight="700" fill="#009639">NGINX<tspan dx="12" font-size="14" font-weight="500" fill="#4A5C6B">Reverse proxy · serves the built SPA · /api upstream</tspan></text>

    <!-- nginx -> middleware chain -->
    <g stroke="#93A3B5" stroke-width="1.6" fill="none">
      <path d="M700 180v14"/>
      <path d="M700 194H152"/>
      <path d="M152 194v12" marker-end="url(#arw)"/>
    </g>

    <!-- ========================= MIDDLEWARE CHAIN ====================== -->
    <g>
      <rect x="30" y="208" width="244" height="62" rx="12" fill="#E6F4F2" stroke="#7FC0B6" stroke-width="1.5"/>
      <rect x="304" y="208" width="244" height="62" rx="12" fill="#E6F4F2" stroke="#7FC0B6" stroke-width="1.5"/>
      <rect x="578" y="208" width="244" height="62" rx="12" fill="#E6F4F2" stroke="#7FC0B6" stroke-width="1.5"/>
      <rect x="852" y="208" width="244" height="62" rx="12" fill="#E6F4F2" stroke="#7FC0B6" stroke-width="1.5"/>
      <rect x="1126" y="208" width="244" height="62" rx="12" fill="#E6F4F2" stroke="#7FC0B6" stroke-width="1.5"/>

      <!-- shield / helmet -->
      <g transform="translate(48,227)" fill="none" stroke="#12756C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3.2 19 5.8v5.5c0 4.2-2.9 7.4-7 9-4.1-1.6-7-4.8-7-9V5.8l7-2.6Z"/>
      </g>
      <text x="80" y="244" font-size="13.5" font-weight="600" fill="#0E4A45">Helmet headers</text>

      <!-- globe -->
      <g transform="translate(322,227)" fill="none" stroke="#12756C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="8.6"/>
        <path d="M3.4 12h17.2"/>
        <path d="M12 3.4c2.4 2.4 3.6 5.4 3.6 8.6s-1.2 6.2-3.6 8.6c-2.4-2.4-3.6-5.4-3.6-8.6S9.6 5.8 12 3.4Z"/>
      </g>
      <text x="354" y="244" font-size="13.5" font-weight="600" fill="#0E4A45">CORS whitelist</text>

      <!-- gauge -->
      <g transform="translate(596,227)" fill="none" stroke="#12756C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3.6 17a8.7 8.7 0 1 1 16.8 0"/>
        <path d="M12 17.2 16.2 12"/>
        <circle cx="12" cy="17.4" r="1.4" fill="#12756C" stroke="none"/>
      </g>
      <text x="628" y="244" font-size="13.5" font-weight="600" fill="#0E4A45">Redis rate limiting</text>

      <!-- key -->
      <g transform="translate(870,227)" fill="none" stroke="#12756C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="7.8" cy="12" r="4.2"/>
        <path d="M12 12h9M18.4 12v3.4M15.4 12v2.6"/>
      </g>
      <text x="902" y="244" font-size="13.5" font-weight="600" fill="#0E4A45">JWT authentication</text>

      <!-- circle check -->
      <g transform="translate(1144,227)" fill="none" stroke="#12756C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="8.6"/>
        <path d="m8.2 12.2 2.6 2.6 5-5.4"/>
      </g>
      <text x="1176" y="244" font-size="13.5" font-weight="600" fill="#0E4A45">Zod validation</text>

      <g stroke="#93A3B5" stroke-width="1.6" fill="none">
        <path d="M278 239h18" marker-end="url(#arw)"/>
        <path d="M552 239h18" marker-end="url(#arw)"/>
        <path d="M826 239h18" marker-end="url(#arw)"/>
        <path d="M1100 239h18" marker-end="url(#arw)"/>
      </g>
    </g>

    <!-- chain -> core -->
    <g stroke="#93A3B5" stroke-width="1.6" fill="none">
      <path d="M1248 270v14"/>
      <path d="M1248 284H700"/>
      <path d="M700 284v12" marker-end="url(#arw)"/>
    </g>

    <!-- ========================== MONOLITH CORE ======================== -->
    <rect x="30" y="296" width="1340" height="116" rx="14" fill="url(#core)"/>
    <text x="700" y="336" text-anchor="middle" font-size="26" font-weight="700" letter-spacing="1.6" fill="#FFFFFF">MONOLITH CORE</text>
    <text x="700" y="358" text-anchor="middle" font-size="13.5" fill="#C8DCEE">Node.js 20 · Express 4 · modular monolith on :5000</text>

    <g fill="#FFFFFF" fill-opacity="0.14" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="1">
      <rect x="63" y="372" width="97" height="28" rx="7"/>
      <rect x="170" y="372" width="97" height="28" rx="7"/>
      <rect x="277" y="372" width="97" height="28" rx="7"/>
      <rect x="384" y="372" width="97" height="28" rx="7"/>
      <rect x="491" y="372" width="97" height="28" rx="7"/>
      <rect x="598" y="372" width="97" height="28" rx="7"/>
      <rect x="705" y="372" width="97" height="28" rx="7"/>
      <rect x="812" y="372" width="97" height="28" rx="7"/>
      <rect x="919" y="372" width="97" height="28" rx="7"/>
      <rect x="1026" y="372" width="97" height="28" rx="7"/>
      <rect x="1133" y="372" width="97" height="28" rx="7"/>
      <rect x="1240" y="372" width="97" height="28" rx="7"/>
    </g>
    <g font-size="11" font-weight="600" fill="#E9F2F9" text-anchor="middle">
      <text x="111.5" y="390">auth</text>
      <text x="218.5" y="390">users</text>
      <text x="325.5" y="390">parking</text>
      <text x="432.5" y="390">booking</text>
      <text x="539.5" y="390">pricing</text>
      <text x="646.5" y="390">payment</text>
      <text x="753.5" y="390">billing</text>
      <text x="860.5" y="390">session</text>
      <text x="967.5" y="390">recognition</text>
      <text x="1074.5" y="390">analytics</text>
      <text x="1181.5" y="390">geo</text>
      <text x="1288.5" y="390">admin</text>
    </g>

    <!-- core -> data + integrations -->
    <g stroke="#93A3B5" stroke-width="1.6" fill="none">
      <path d="M200 412v34M880 412v34"/>
      <path d="M187 446h339M872 446h339"/>
      <path d="M187 446v20" marker-end="url(#arw)"/>
      <path d="M526 446v20" marker-end="url(#arw)"/>
      <path d="M872 446v20" marker-end="url(#arw)"/>
      <path d="M1211 446v20" marker-end="url(#arw)"/>
    </g>

    <text x="356" y="434" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing="1.3" fill="#6B7C8C">PERSISTENCE &amp; CACHE</text>
    <text x="1042" y="434" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing="1.3" fill="#6B7C8C">EXTERNAL INTEGRATIONS</text>

    <!-- ===================== PERSISTENCE & EXTERNALS =================== -->
    <g>
      <rect x="30" y="472" width="315" height="92" rx="12" fill="#EAF6EE" stroke="#7EC194" stroke-width="1.5"/>
      <rect x="369" y="472" width="315" height="92" rx="12" fill="#EAF6EE" stroke="#7EC194" stroke-width="1.5"/>
      <rect x="715" y="472" width="315" height="92" rx="12" fill="#FCF2E9" stroke="#E3AC7F" stroke-width="1.5"/>
      <rect x="1054" y="472" width="315" height="92" rx="12" fill="#FCF2E9" stroke="#E3AC7F" stroke-width="1.5"/>

      <!-- leaf -->
      <g transform="translate(52,503) scale(1.25)" fill="none" stroke="#1B7D3F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3c3.2 3.2 4.8 6.2 4.8 9.1 0 3.4-2 5.9-4.8 7.3-2.8-1.4-4.8-3.9-4.8-7.3C7.2 9.2 8.8 6.2 12 3Z"/>
        <path d="M12 7.4v12.3"/>
      </g>
      <text x="96" y="512" font-size="16" font-weight="600" fill="#14532D">MongoDB 7</text>
      <text x="96" y="534" font-size="12.5" fill="#5F7368">Mongoose 8 · bookings, sessions, audit</text>

      <!-- bolt -->
      <g transform="translate(391,503) scale(1.25)" fill="none" stroke="#C0392B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13.3 2.6 5.6 13.4h5.2L10.3 21.4 18.4 10.4h-5.5l.4-7.8Z"/>
      </g>
      <text x="435" y="512" font-size="16" font-weight="600" fill="#14532D">Redis 7</text>
      <text x="435" y="534" font-size="12.5" fill="#5F7368">Cache · rate limits · distributed locks</text>

      <!-- spark -->
      <g transform="translate(737,503) scale(1.25)" fill="none" stroke="#C2610C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.4 2.6c.9 4.5 2.5 6.1 7 7-4.5.9-6.1 2.5-7 7-.9-4.5-2.5-6.1-7-7 4.5-.9 6.1-2.5 7-7Z"/>
        <path d="M18.3 14.6c.4 1.9 1.1 2.6 3 3-1.9.4-2.6 1.1-3 3-.4-1.9-1.1-2.6-3-3 1.9-.4 2.6-1.1 3-3Z"/>
      </g>
      <text x="781" y="512" font-size="16" font-weight="600" fill="#7C3D0C">Gemini 2.5 Flash</text>
      <text x="781" y="534" font-size="12.5" fill="#7A6552">Vision API · number-plate OCR</text>

      <!-- card -->
      <g transform="translate(1076,503) scale(1.25)" fill="none" stroke="#C2610C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2.8" y="5.4" width="18.4" height="13.2" rx="2.2"/>
        <path d="M2.8 10.2h18.4M6.6 14.8h4.2"/>
      </g>
      <text x="1120" y="512" font-size="16" font-weight="600" fill="#7C3D0C">Razorpay</text>
      <text x="1120" y="534" font-size="12.5" fill="#7A6552">Checkout orders · signed webhooks</text>
    </g>

    <!-- ========================== DEPLOYMENT =========================== -->
    <rect x="30" y="592" width="1340" height="126" rx="14" fill="#1D3A55"/>

    <g>
      <rect x="267" y="614" width="200" height="44" rx="9" fill="#2B5074" stroke="#497096" stroke-width="1.2"/>
      <rect x="489" y="614" width="200" height="44" rx="9" fill="#2B5074" stroke="#497096" stroke-width="1.2"/>
      <rect x="711" y="614" width="200" height="44" rx="9" fill="#2B5074" stroke="#497096" stroke-width="1.2"/>
      <rect x="933" y="614" width="200" height="44" rx="9" fill="#2B5074" stroke="#497096" stroke-width="1.2"/>

      <g fill="none" stroke="#9CC2E0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <g transform="translate(287,626) scale(0.83)"><path d="M12 2.8 20.4 7v10L12 21.2 3.6 17V7L12 2.8Z"/><path d="M3.6 7 12 11.2 20.4 7M12 11.2v10"/></g>
        <g transform="translate(509,626) scale(0.83)"><path d="M12 2.8 20.4 7v10L12 21.2 3.6 17V7L12 2.8Z"/><path d="M3.6 7 12 11.2 20.4 7M12 11.2v10"/></g>
        <g transform="translate(731,626) scale(0.83)"><path d="M12 2.8 20.4 7v10L12 21.2 3.6 17V7L12 2.8Z"/><path d="M3.6 7 12 11.2 20.4 7M12 11.2v10"/></g>
        <g transform="translate(953,626) scale(0.83)"><path d="M12 2.8 20.4 7v10L12 21.2 3.6 17V7L12 2.8Z"/><path d="M3.6 7 12 11.2 20.4 7M12 11.2v10"/></g>
      </g>

      <g font-size="13" font-weight="600" fill="#DCE9F4">
        <text x="317" y="641">mongo:7</text>
        <text x="539" y="641">redis:7-alpine</text>
        <text x="761" y="641">backend :5000</text>
        <text x="983" y="641">frontend :80</text>
      </g>
    </g>

    <text x="700" y="688" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="0.7" fill="#FFFFFF">DEPLOYMENT &amp; ORCHESTRATION — Docker Compose</text>
    <text x="700" y="707" text-anchor="middle" font-size="12" fill="#A9C2D8">One bridge network · named volumes for Mongo and Redis · healthchecked startup order</text>

  </g>
</svg>
