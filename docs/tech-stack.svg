<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 556" width="1400" height="556" role="img" aria-labelledby="tt ds">
  <title id="tt">ParKar technology stack</title>
  <desc id="ds">Frontend: React 18, Tailwind CSS 4, React Router 7, Leaflet, OpenStreetMap. Reverse proxy: Nginx. Backend: Node.js, Express. Database: MongoDB, Redis. External services: Gemini 2.5 Flash, Razorpay, Cloudinary. Build and deployment: Docker Compose running mongo, redis, backend and nginx.</desc>

